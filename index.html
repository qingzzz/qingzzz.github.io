<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SIX TRIES — a word game</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
  @import url('https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,600;0,9..144,900;1,9..144,500&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap');

  :root{
    --ink:#1c1b19;
    --paper:#efe9dd;
    --paper-dim:#d9d1bf;
    --rule:#3a3833;
    --correct:#4c6b4f;
    --present:#b9932f;
    --absent:#6b6459;
    --absent-bg:#2a2823;
    --accent:#b9491f;
  }

  *{box-sizing:border-box;}

  body{
    margin:0;
    min-height:100vh;
    background:var(--ink);
    color:var(--paper);
    font-family:'IBM Plex Mono', monospace;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:28px 16px 60px;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.03), transparent 40%),
      radial-gradient(circle at 80% 90%, rgba(255,255,255,0.02), transparent 45%);
  }

  header{
    width:100%;
    max-width:520px;
    text-align:center;
    margin-bottom:18px;
    border-bottom:1px solid var(--rule);
    padding-bottom:16px;
  }

  .masthead{
    display:flex;
    justify-content:space-between;
    align-items:baseline;
    font-size:11px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--absent);
    margin-bottom:6px;
  }

  h1{
    font-family:'Fraunces', serif;
    font-weight:900;
    font-style:italic;
    font-size:44px;
    letter-spacing:0.01em;
    margin:0;
    line-height:1;
  }

  .sub{
    margin-top:8px;
    font-size:12px;
    color:var(--paper-dim);
    letter-spacing:0.04em;
  }

  #board{
    display:grid;
    grid-template-rows:repeat(6, 1fr);
    gap:8px;
    margin:20px 0 24px;
  }

  .row{
    display:grid;
    grid-template-columns:repeat(5, 54px);
    gap:8px;
  }

  .tile{
    width:54px;
    height:54px;
    border:2px solid var(--rule);
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:'Fraunces', serif;
    font-weight:600;
    font-size:26px;
    color:var(--paper);
    text-transform:uppercase;
    background:transparent;
    transition:transform 0.15s ease;
  }

  .tile.filled{
    border-color:#5a564c;
    animation:pop 0.1s ease;
  }

  .tile.flip{
    animation:flip 0.55s ease forwards;
  }

  .tile.correct{ background:var(--correct); border-color:var(--correct); color:var(--paper); }
  .tile.present{ background:var(--present); border-color:var(--present); color:#1c1b19; }
  .tile.absent{ background:var(--absent-bg); border-color:var(--rule); color:var(--absent); }

  @keyframes pop{
    0%{ transform:scale(0.9); }
    100%{ transform:scale(1); }
  }

  @keyframes flip{
    0%{ transform:rotateX(0deg); }
    50%{ transform:rotateX(90deg); }
    51%{ transform:rotateX(90deg); }
    100%{ transform:rotateX(0deg); }
  }

  .shake{ animation:shake 0.4s ease; }
  @keyframes shake{
    10%,90%{ transform:translateX(-2px); }
    20%,80%{ transform:translateX(4px); }
    30%,50%,70%{ transform:translateX(-8px); }
    40%,60%{ transform:translateX(8px); }
  }

  #message{
    min-height:20px;
    font-size:13px;
    letter-spacing:0.05em;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:4px;
    text-align:center;
  }

  #keyboard{
    display:flex;
    flex-direction:column;
    gap:7px;
    width:100%;
    max-width:500px;
  }

  .krow{
    display:flex;
    justify-content:center;
    gap:5px;
  }

  .key{
    background:var(--paper-dim);
    color:var(--ink);
    border:none;
    border-radius:3px;
    padding:14px 0;
    flex:1;
    max-width:40px;
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:13px;
    text-transform:uppercase;
    cursor:pointer;
    transition:background 0.15s ease, transform 0.05s ease;
  }

  .key:active{ transform:translateY(1px); }

  .key.wide{ max-width:64px; font-size:11px; }

  .key.correct{ background:var(--correct); color:var(--paper); }
  .key.present{ background:var(--present); color:#1c1b19; }
  .key.absent{ background:var(--absent-bg); color:var(--absent); }

  #newgame{
    margin-top:26px;
    background:none;
    border:1.5px solid var(--accent);
    color:var(--accent);
    font-family:'IBM Plex Mono', monospace;
    font-weight:600;
    font-size:12px;
    letter-spacing:0.12em;
    text-transform:uppercase;
    padding:12px 26px;
    cursor:pointer;
    transition:background 0.15s ease, color 0.15s ease;
  }
  #newgame:hover{ background:var(--accent); color:var(--paper); }

  footer{
    margin-top:22px;
    font-size:10px;
    letter-spacing:0.1em;
    color:var(--rule);
    text-transform:uppercase;
  }

  @media (max-width:380px){
    .row{ grid-template-columns:repeat(5, 46px); }
    .tile{ width:46px; height:46px; font-size:22px; }
    .key{ padding:12px 0; font-size:12px; }
  }
</style>
</head>
<body>

<header>
  <div class="masthead">
    <span>Edition No. <span id="edition">1</span></span>
    <span id="datestamp"></span>
  </div>
  <h1>Six Tries</h1>
  <div class="sub">Guess the five-letter word. You get six lines.</div>
</header>

<div id="message"></div>
<div id="board"></div>
<div id="keyboard"></div>
<button id="newgame">Set a new word</button>
<footer>Green — right spot · Amber — wrong spot · Ash — not in the word</footer>

<script>
// Small local fallback in case the network fetch below fails (offline, blocked, etc).
const FALLBACK_WORDS = ["ABOUT","OTHER","WHICH","THEIR","THERE","FIRST","WOULD","THESE","CLICK","SOUND",
"WORLD","MUSIC","HAPPY","LIGHT","QUICK","BRAVE","STONE","RIVER","CLOUD","GRAPE",
"HORSE","TIGER","OCEAN","PLANT","CHESS","BREAD","STORM","FLAME","GLASS","MAGIC"];

const ANSWER_LEN = 5;
const MAX_TRIES = 6;

let ANSWERS = FALLBACK_WORDS;
let VALID_GUESSES = new Set(FALLBACK_WORDS);
let wordsReady = false;

async function loadWordLists(){
  setMessage("Loading word list…");
  try{
    const [answersRes, guessesRes] = await Promise.all([
      fetch('https://gist.githubusercontent.com/cfreshman/a03ef2cba789d8cf00c08f767e0fad7b/raw/wordle-answers-alphabetical.txt'),
      fetch('https://gist.githubusercontent.com/cfreshman/cdcdf777450c5b5301e439061d29694c/raw/wordle-allowed-guesses.txt')
    ]);
    if(!answersRes.ok || !guessesRes.ok) throw new Error('bad response');
    const answersText = await answersRes.text();
    const guessesText = await guessesRes.text();

    const answers = answersText.split('\n').map(w=>w.trim().toUpperCase()).filter(w=>w.length===ANSWER_LEN);
    const guesses = guessesText.split('\n').map(w=>w.trim().toUpperCase()).filter(w=>w.length===ANSWER_LEN);

    if(answers.length > 100){
      ANSWERS = answers;
      VALID_GUESSES = new Set([...answers, ...guesses]);
    }
  }catch(e){
    console.warn('Falling back to local word list:', e);
    ANSWERS = FALLBACK_WORDS;
    VALID_GUESSES = new Set(FALLBACK_WORDS);
  }
  wordsReady = true;
  setMessage("");
  startGame(true);
}

let answer = "";
let currentRow = 0;
let currentGuess = "";
let gameOver = false;
let edition = 1;

const board = document.getElementById('board');
const message = document.getElementById('message');
const editionEl = document.getElementById('edition');
const datestampEl = document.getElementById('datestamp');

const KB_ROWS = [
  ["Q","W","E","R","T","Y","U","I","O","P"],
  ["A","S","D","F","G","H","J","K","L"],
  ["ENTER","Z","X","C","V","B","N","M","BACK"]
];

const keyboard = document.getElementById('keyboard');

function buildBoard(){
  board.innerHTML = "";
  for(let r=0;r<MAX_TRIES;r++){
    const row = document.createElement('div');
    row.className = 'row';
    row.id = 'row-'+r;
    for(let c=0;c<ANSWER_LEN;c++){
      const tile = document.createElement('div');
      tile.className = 'tile';
      tile.id = 'tile-'+r+'-'+c;
      row.appendChild(tile);
    }
    board.appendChild(row);
  }
}

function buildKeyboard(){
  keyboard.innerHTML = "";
  KB_ROWS.forEach(rowKeys=>{
    const krow = document.createElement('div');
    krow.className = 'krow';
    rowKeys.forEach(k=>{
      const btn = document.createElement('button');
      btn.className = 'key' + ((k==="ENTER"||k==="BACK") ? " wide" : "");
      btn.textContent = k === "BACK" ? "DEL" : k;
      btn.id = 'key-'+k;
      btn.addEventListener('click', ()=>handleKey(k));
      krow.appendChild(btn);
    });
    keyboard.appendChild(krow);
  });
}

function setMessage(text){
  message.textContent = text;
}

function startGame(isFirst){
  if(!wordsReady) return;
  answer = ANSWERS[Math.floor(Math.random()*ANSWERS.length)];
  currentRow = 0;
  currentGuess = "";
  gameOver = false;
  setMessage("");
  buildBoard();
  buildKeyboard();
  if(!isFirst) edition++;
  editionEl.textContent = edition;
}

function handleKey(k){
  if(gameOver) return;
  if(k === "ENTER"){
    submitGuess();
  } else if(k === "BACK"){
    currentGuess = currentGuess.slice(0,-1);
    renderCurrentRow();
  } else if(/^[A-Z]$/.test(k) && currentGuess.length < ANSWER_LEN){
    currentGuess += k;
    renderCurrentRow();
  }
}

function renderCurrentRow(){
  for(let c=0;c<ANSWER_LEN;c++){
    const tile = document.getElementById('tile-'+currentRow+'-'+c);
    const letter = currentGuess[c] || "";
    tile.textContent = letter;
    tile.classList.toggle('filled', !!letter);
  }
}

function shakeRow(){
  const row = document.getElementById('row-'+currentRow);
  row.classList.add('shake');
  setTimeout(()=>row.classList.remove('shake'), 400);
}

function submitGuess(){
  if(currentGuess.length < ANSWER_LEN){
    setMessage("Not enough letters");
    shakeRow();
    return;
  }
  if(!VALID_GUESSES.has(currentGuess)){
    setMessage("Not in word list");
    shakeRow();
    return;
  }
  setMessage("");
  const result = scoreGuess(currentGuess, answer);
  animateRow(result);
}

function scoreGuess(guess, answer){
  const result = new Array(ANSWER_LEN).fill('absent');
  const answerArr = answer.split('');
  const guessArr = guess.split('');
  const used = new Array(ANSWER_LEN).fill(false);

  for(let i=0;i<ANSWER_LEN;i++){
    if(guessArr[i] === answerArr[i]){
      result[i] = 'correct';
      used[i] = true;
    }
  }
  for(let i=0;i<ANSWER_LEN;i++){
    if(result[i] === 'correct') continue;
    for(let j=0;j<ANSWER_LEN;j++){
      if(!used[j] && guessArr[i] === answerArr[j]){
        result[i] = 'present';
        used[j] = true;
        break;
      }
    }
  }
  return result;
}

function animateRow(result){
  for(let c=0;c<ANSWER_LEN;c++){
    const tile = document.getElementById('tile-'+currentRow+'-'+c);
    setTimeout(()=>{
      tile.classList.add('flip');
      setTimeout(()=>{
        tile.classList.add(result[c]);
      }, 275);
    }, c*280);
  }

  const letter_to_state = {};
  currentGuess.split('').forEach((ch,i)=>{
    const state = result[i];
    const existing = letter_to_state[ch];
    const rank = {absent:0, present:1, correct:2};
    if(!existing || rank[state] > rank[existing]){
      letter_to_state[ch] = state;
    }
  });

  setTimeout(()=>{
    Object.keys(letter_to_state).forEach(ch=>{
      const btn = document.getElementById('key-'+ch);
      if(btn){
        btn.classList.remove('correct','present','absent');
        btn.classList.add(letter_to_state[ch]);
      }
    });

    if(currentGuess === answer){
      gameOver = true;
      const lines = ["Sharp.", "Excellent.", "Well read.", "Nicely done.", "Bravo.", "Clean solve."];
      setMessage(lines[Math.min(currentRow, lines.length-1)] + "  The word was " + answer + ".");
    } else if(currentRow === MAX_TRIES-1){
      gameOver = true;
      setMessage("Out of tries. The word was " + answer + ".");
    } else {
      currentRow++;
      currentGuess = "";
    }
  }, ANSWER_LEN*280 + 300);
}

document.addEventListener('keydown', (e)=>{
  const key = e.key.toUpperCase();
  if(key === "ENTER") handleKey("ENTER");
  else if(key === "BACKSPACE") handleKey("BACK");
  else if(/^[A-Z]$/.test(key)) handleKey(key);
});

document.getElementById('newgame').addEventListener('click', ()=>startGame(false));

const today = new Date();
datestampEl.textContent = today.toLocaleDateString('en-US', { month:'short', day:'numeric', year:'numeric' }).toUpperCase();

buildBoard();
buildKeyboard();
loadWordLists();
</script>

</body>
</html>
